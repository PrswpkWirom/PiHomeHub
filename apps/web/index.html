<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="PiHomeHub is a private LAN and Tailscale dashboard for home devices, services, and maintenance tasks." />
    <meta property="og:title" content="PiHomeHub" />
    <meta property="og:description" content="Private home dashboard for devices, services, and maintenance tasks." />
    <meta property="og:image" content="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PiHomeHub</title>
    <script>
      (() => {
        const stored = window.localStorage.getItem("pihomehub-theme");
        const theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = theme === "system" ? (prefersDark ? "dark" : "light") : theme;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body class="bg-app">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
