x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &http-healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    environment:
      PIHOMEHUB_ENV: production
      PIHOMEHUB_ACCESS_MODE: ${PIHOMEHUB_ACCESS_MODE:-https}
      PIHOMEHUB_SECRET_KEY: ${PIHOMEHUB_SECRET_KEY:-}
      PIHOMEHUB_CONTROL_AGENT_SECRET: ${PIHOMEHUB_CONTROL_AGENT_SECRET:-}
      PIHOMEHUB_DATABASE_URL: sqlite:////data/pihomehub.db
      PIHOMEHUB_PUBLIC_BASE_URL: ${PIHOMEHUB_PUBLIC_BASE_URL:-}
      PIHOMEHUB_ALLOWED_ORIGINS: ${PIHOMEHUB_ALLOWED_ORIGINS:-}
      PIHOMEHUB_CONTROL_AGENT_URL: http://control-agent:9000
      PIHOMEHUB_WOL_AGENT_URL: http://172.30.0.1:9001
      PIHOMEHUB_TRUSTED_PROXY_IPS: 172.30.0.2
      PIHOMEHUB_HOST_PROC_NET_PATH: /host/proc/net
      PIHOMEHUB_HOST_MEMINFO_PATH: /host/meminfo
      PIHOMEHUB_HOST_THERMAL_PATH: /host/thermal/thermal_zone0/temp
      PIHOMEHUB_HOST_ROOT_PROBE_PATH: /host/rootfs-metrics
      PIHOMEHUB_NOTIFICATION_MONITOR_INTERVAL_SECONDS: ${PIHOMEHUB_NOTIFICATION_MONITOR_INTERVAL_SECONDS:-30}
      PIHOMEHUB_NOTIFICATION_OFFLINE_FAILURES: ${PIHOMEHUB_NOTIFICATION_OFFLINE_FAILURES:-3}
      PIHOMEHUB_NOTIFICATION_RECOVERY_SUCCESSES: ${PIHOMEHUB_NOTIFICATION_RECOVERY_SUCCESSES:-2}
      PIHOMEHUB_NOTIFICATION_TEMPERATURE_HIGH_C: ${PIHOMEHUB_NOTIFICATION_TEMPERATURE_HIGH_C:-75}
      PIHOMEHUB_NOTIFICATION_TEMPERATURE_RECOVERY_C: ${PIHOMEHUB_NOTIFICATION_TEMPERATURE_RECOVERY_C:-70}
      PIHOMEHUB_NOTIFICATION_TEMPERATURE_DURATION_SECONDS: ${PIHOMEHUB_NOTIFICATION_TEMPERATURE_DURATION_SECONDS:-300}
      PIHOMEHUB_NOTIFICATION_DISK_WARNING_PERCENT: ${PIHOMEHUB_NOTIFICATION_DISK_WARNING_PERCENT:-85}
      PIHOMEHUB_NOTIFICATION_DISK_CRITICAL_PERCENT: ${PIHOMEHUB_NOTIFICATION_DISK_CRITICAL_PERCENT:-95}
      PIHOMEHUB_NOTIFICATION_DISK_DEGRADED_PERCENT: ${PIHOMEHUB_NOTIFICATION_DISK_DEGRADED_PERCENT:-90}
      PIHOMEHUB_NOTIFICATION_DISK_RECOVERY_PERCENT: ${PIHOMEHUB_NOTIFICATION_DISK_RECOVERY_PERCENT:-80}
      PIHOMEHUB_NOTIFICATION_DISK_DURATION_SECONDS: ${PIHOMEHUB_NOTIFICATION_DISK_DURATION_SECONDS:-120}
      PIHOMEHUB_NOTIFICATION_MEMORY_HIGH_PERCENT: ${PIHOMEHUB_NOTIFICATION_MEMORY_HIGH_PERCENT:-90}
      PIHOMEHUB_NOTIFICATION_MEMORY_RECOVERY_PERCENT: ${PIHOMEHUB_NOTIFICATION_MEMORY_RECOVERY_PERCENT:-85}
      PIHOMEHUB_NOTIFICATION_MEMORY_DURATION_SECONDS: ${PIHOMEHUB_NOTIFICATION_MEMORY_DURATION_SECONDS:-300}
      PIHOMEHUB_NOTIFICATION_METRIC_RECOVERY_SECONDS: ${PIHOMEHUB_NOTIFICATION_METRIC_RECOVERY_SECONDS:-120}
      PIHOMEHUB_SERVICE_CONFIG_FILE: /run/pihomehub/services.json
      PIHOMEHUB_PORT_CONFIGURATION_MODE: operator
    expose:
      - "8000"
    volumes:
      - backend-data:/data
      - /proc/net:/host/proc/net:ro
      - ${PIHOMEHUB_HOST_MEMINFO_SOURCE:-/proc/meminfo}:/host/meminfo:ro
      - ${PIHOMEHUB_HOST_THERMAL_SOURCE:-/sys/class/thermal}:/host/thermal:ro
      - type: bind
        source: ${PIHOMEHUB_HOST_ROOT_METRICS_PATH:-/.pihomehub/rootfs-metrics}
        target: /host/rootfs-metrics
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./generated
        target: /run/pihomehub
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      control-agent:
        condition: service_healthy
      wol-agent:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
    init: true
    stop_grace_period: 130s
    networks:
      - edge
      - control
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true

  control-agent:
    build:
      context: ../apps/control_agent
      dockerfile: Dockerfile
    environment:
      PIHOMEHUB_CONTROL_AGENT_SECRET: ${PIHOMEHUB_CONTROL_AGENT_SECRET:-}
      PIHOMEHUB_CONTROL_AGENT_SERVICES: adguard-home,gitea,uptime-kuma,vaultwarden,mosquitto
      PIHOMEHUB_CONTROL_AGENT_COMPOSE_FILE: /run/pihomehub/services.compose.json
      PIHOMEHUB_CONTROL_AGENT_CATALOG_FILE: /run/pihomehub/services.json
      PIHOMEHUB_CONTROL_AGENT_OPERATIONS_DB: /data/operations.db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
      - control-agent-data:/data
      - type: bind
        source: ./generated
        target: /run/pihomehub
        read_only: true
        bind:
          create_host_path: false
    group_add:
      - "${DOCKER_GID:-999}"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).read()"]
    init: true
    stop_grace_period: 130s
    networks:
      - control
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true

  wol-agent:
    build:
      context: ../apps/control_agent
      dockerfile: Dockerfile
    command: ["uvicorn", "app.wol:app", "--host", "172.30.0.1", "--port", "9001", "--no-server-header"]
    environment:
      PIHOMEHUB_WOL_AGENT_SECRET: ${PIHOMEHUB_CONTROL_AGENT_SECRET:-}
    # Host networking lets the packet leave Docker through the Pi's LAN
    # interface. It listens only on the private edge bridge gateway and has no
    # Docker socket or other host mounts.
    network_mode: host
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://172.30.0.1:9001/health', timeout=3).read()"]
    init: true
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    expose:
      - "80"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
    init: true
    networks:
      - edge
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      PIHOMEHUB_ACCESS_MODE: ${PIHOMEHUB_ACCESS_MODE:-https}
      PIHOMEHUB_HOST: ${PIHOMEHUB_HOST:-localhost}
      PIHOMEHUB_TRUSTED_INGRESS_PROXY_IPS: ${PIHOMEHUB_TRUSTED_INGRESS_PROXY_IPS:-127.0.0.1 ::1}
    ports:
      - "${PIHOMEHUB_INGRESS_BIND_ADDRESS:-127.0.0.1}:${PIHOMEHUB_HTTP_PORT:-80}:80"
      - "${PIHOMEHUB_HTTPS_BIND_ADDRESS:-${PIHOMEHUB_INGRESS_BIND_ADDRESS:-127.0.0.1}}:${PIHOMEHUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
    init: true
    networks:
      edge:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true

  adguard-home:
    image: adguard/adguardhome:v0.107.77@sha256:e6f2b8bcda06064ab055b44933a4f0e983c35558b9cdb8d2e7ab1efcee36d890
    container_name: adguard-home
    profiles: [home-services]
    ports:
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${ADGUARD_WEB_PORT:-3001}:80"
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${ADGUARD_DNS_PORT:-53}:53/udp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped
    logging: *bounded-logging

  gitea:
    image: docker.gitea.com/gitea:1.26.4@sha256:8e25c717b8f748445e15ec46e0390f577cb628101184cb0a150d1dae126c1f39
    container_name: gitea
    profiles: [home-services]
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${GITEA_HTTP_PORT:-3002}:3000"
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data
    restart: unless-stopped
    logging: *bounded-logging

  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0@sha256:91e963bfda569ba115206e843febb446f473ab525add4e08b2b9e3beffa16985
    container_name: uptime-kuma
    profiles: [home-services]
    ports:
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${UPTIME_KUMA_HTTP_PORT:-3003}:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped
    logging: *bounded-logging

  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    profiles: [home-services]
    ports:
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${VAULTWARDEN_HTTP_PORT:-3004}:80"
    volumes:
      - vaultwarden-data:/data
    restart: unless-stopped
    logging: *bounded-logging

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    container_name: mosquitto
    profiles: [mqtt]
    ports:
      - "${PIHOMEHUB_BIND_ADDRESS:-100.65.234.44}:${MOSQUITTO_MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/generated:/mosquitto/config/generated:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped
    logging: *bounded-logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Keep dynamic allocations away from Caddy (.2) and dev Vite (.3).
          ip_range: 172.30.0.128/25
          gateway: 172.30.0.1
  control:
    internal: true

volumes:
  backend-data:
  caddy-data:
  caddy-config:
  adguard-work:
  adguard-conf:
  gitea-data:
  uptime-kuma-data:
  vaultwarden-data:
  mosquitto-data:
  mosquitto-log:
  control-agent-data:
