services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    env_file:
      - ../apps/backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend:/app

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
    depends_on:
      - backend

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - backend

  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    profiles:
      - home-services
    ports:
      - "3001:3000"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    profiles:
      - home-services
    ports:
      - "3004:80"
    volumes:
      - vaultwarden-data:/data
    restart: unless-stopped

volumes:
  adguard-work:
  adguard-conf:
  vaultwarden-data:
