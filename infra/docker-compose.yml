services:
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    env_file:
      - ../apps/backend/.env
    environment:
      PIHOMEHUB_COMPOSE_FILE: /workspace/infra/docker-compose.yml
      PIHOMEHUB_COMPOSE_PROJECT_DIRECTORY: /workspace/infra
      PIHOMEHUB_COMPOSE_ENV_FILE: /workspace/infra/.env
      PIHOMEHUB_HOST_PROC_NET_PATH: /host/proc/net
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend:/app
      - ..:/workspace:ro
      - ../infra:/workspace/infra
      - /proc/net:/host/proc/net:ro
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      PIHOMEHUB_VITE_CACHE_DIR: /tmp/pihomehub-vite-cache
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - backend

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - backend

  adguard-home:
    image: adguard/adguardhome:latest
    container_name: adguard-home
    profiles:
      - home-services
    ports:
      - "${ADGUARD_WEB_PORT:-3001}:3000"
      - "${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${ADGUARD_DNS_PORT:-53}:53/udp"
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    restart: unless-stopped

  gitea:
    image: docker.gitea.com/gitea:1
    container_name: gitea
    profiles:
      - home-services
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
    ports:
      - "${GITEA_HTTP_PORT:-3002}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    profiles:
      - home-services
    ports:
      - "${UPTIME_KUMA_HTTP_PORT:-3003}:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    profiles:
      - home-services
    ports:
      - "${VAULTWARDEN_HTTP_PORT:-3004}:80"
    volumes:
      - vaultwarden-data:/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    profiles:
      - home-services
    ports:
      - "${MOSQUITTO_MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

volumes:
  adguard-work:
  adguard-conf:
  gitea-data:
  uptime-kuma-data:
  vaultwarden-data:
  mosquitto-data:
  mosquitto-log:
  web-node-modules:
