services:
  backend:
    environment:
      PIHOMEHUB_ENV: development
      PIHOMEHUB_SECRET_KEY: development-only-change-me
      PIHOMEHUB_CONTROL_AGENT_SECRET: development-control-agent-secret
      PIHOMEHUB_PUBLIC_BASE_URL: http://localhost:5173
      PIHOMEHUB_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PIHOMEHUB_TRUSTED_PROXY_IPS: 172.30.0.3
      PIHOMEHUB_HOST_MEMINFO_PATH: /proc/meminfo
      PIHOMEHUB_HOST_THERMAL_PATH: /sys/class/thermal/thermal_zone0/temp
      PIHOMEHUB_HOST_ROOT_PROBE_PATH: /host/rootfs-metrics
    ports:
      - "8000:8000"
    volumes: !override
      - ../apps/backend:/app
      - backend-dev-data:/data

  web:
    build: !reset null
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 120s
    environment:
      PIHOMEHUB_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules
    networks:
      edge:
        ipv4_address: 172.30.0.3

  control-agent:
    environment:
      PIHOMEHUB_CONTROL_AGENT_SECRET: development-control-agent-secret

  wol-agent:
    environment:
      PIHOMEHUB_WOL_AGENT_SECRET: development-control-agent-secret

  caddy:
    profiles: [production-ingress]

volumes:
  backend-dev-data:
  web-node-modules:
