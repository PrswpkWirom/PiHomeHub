services:
  backend:
    environment:
      PIHOMEHUB_ENV: development
      PIHOMEHUB_SECRET_KEY: development-only-change-me
      PIHOMEHUB_CONTROL_AGENT_SECRET: development-control-agent-secret
      PIHOMEHUB_PUBLIC_BASE_URL: http://localhost:5173
      PIHOMEHUB_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend:/app

  web:
    build: !reset null
    image: node:20.19.5-alpine@sha256:6178e78b972f79c335df281f4b7674a2d85071aae2af020ffa39f0a770265435
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      PIHOMEHUB_BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules

  control-agent:
    environment:
      PIHOMEHUB_CONTROL_AGENT_SECRET: development-control-agent-secret

  caddy:
    profiles: [production-ingress]

volumes:
  web-node-modules:
